name: Static preview smoke
on:
  push:
    branches: [sync/final-all-roles]
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Check static pages and browser interactions
        run: |
          python3 tests/audit-static.py
          node --check assets/app.js
          node --check assets/preview.js
          python3 -m http.server 8765 > /tmp/bk-preview-server.log 2>&1 &
          node tests/preview-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-preview-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
